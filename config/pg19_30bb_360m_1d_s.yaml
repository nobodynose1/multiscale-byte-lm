io:
  name_model: 8k_30b_360m_1d_s
  output_dir: /data/students/mai_songlang/mblm-cbqa/runs
  dataset_dir: /data/students/mai_songlang/mblm-cbqa/data/pg19
  dataset_id: pg19
  num_models_to_save: 5
  validate_amount: 100
  log_train_loss_amount: 1000
params:
  num_tokens: 256
  pad_token_id: 0
  input_seq_len: 8192
  seq_lens: [8192]
  hidden_dims: [1024]
  num_layers: [54]
  train_checkpoint_chunks: null
  block:
    # Explicit 1D S Mamba block. Checkpoint-compatible with CLEVR 1D S,
    # not with Transformer 1D T checkpoints.
    block_type: mamba2
    d_state: 128
    d_conv: 4
    expand: 2
    headdim: 64
    dropout: 0
    mamba_backend: mamba2
    pos_emb_type: null
train:
  seed: 42
  target_elements: 30_000_807_936
  target_elements_strategy: sequence
  batch_size: 2
  shuffle_train: false
  max_eval_steps: 50
  learning_rate: 0.001
  gradient_clipping: 1
  gradient_accumulate_every: 24
